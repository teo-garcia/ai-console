## Codex MCP servers

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.datadog]
url = "https://mcp.us5.datadoghq.com/api/unstable/mcp-server/mcp"

[mcp_servers."chrome-devtools"]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]
env = { CHROME_DEBUG_PORT = "9222" }

[mcp_servers.postgres]
command = "npx"
args = [
  "-y",
  "@modelcontextprotocol/server-postgres",
  "postgresql://user:pass@localhost:5432/dev_db",
]

[mcp_servers.filesystem]
command = "npx"
args = [
  "-y",
  "@modelcontextprotocol/server-filesystem",
  "/Users/juan.garcia",
]

[mcp_servers.serena]
startup_timeout_sec = 30
command = "/Users/juan.garcia/.local/bin/uvx"
env = { PATH = "/Users/juan.garcia/.nvm/versions/node/v22.22.2/bin:/Users/juan.garcia/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin" }
args = [
  "-p",
  "3.13",
  "--from",
  "git+https://github.com/oraios/serena@95583663272ddf5d6e07ae6b99aeb05da3e59fdf",
  "serena",
  "start-mcp-server",
  "--project-from-cwd",
  "--context=codex",
]

[mcp_servers.codebase-memory]
startup_timeout_sec = 30
command = "/Users/juan.garcia/.nvm/versions/node/v22.22.2/bin/npx"
env = { PATH = "/Users/juan.garcia/.nvm/versions/node/v22.22.2/bin:/Users/juan.garcia/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin" }
args = ["-y", "codebase-memory-mcp@0.9.0"]
